trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  buildConfiguration: "Release"
  sdkVersion: "10.0.x"
  webProject: "MyWishList.Web.csproj"
  webJobProject: "MyWishList.WebJobs/MyWishList.WebJobs.csproj"
  testProject: "MyWishList.Web.Tests/MyWishList.Web.Tests.csproj"
  publishDir: "$(Build.ArtifactStagingDirectory)/publish"
  webJobDir: "$(Build.ArtifactStagingDirectory)/publish/app_data/jobs/continuous/add-item-processor"
  deploymentZip: "$(Build.ArtifactStagingDirectory)/publish/site.zip"
  appName: "mywishlist-68210"
  azureSubscription: "MyWishList-Azure"

stages:
  - stage: BuildAndTest
    displayName: Build and test
    jobs:
      - job: Build
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: UseDotNet@2
            displayName: "Install .NET SDK"
            inputs:
              packageType: "sdk"
              version: "$(sdkVersion)"

          - task: DotNetCoreCLI@2
            displayName: "Restore"
            inputs:
              command: "restore"
              projects: |
                $(webProject)
                $(webJobProject)
                $(testProject)

          - task: DotNetCoreCLI@2
            displayName: "Build web app"
            inputs:
              command: "build"
              projects: "$(webProject)"
              arguments: "--configuration $(buildConfiguration) --no-restore"

          - task: DotNetCoreCLI@2
            displayName: "Build tests"
            inputs:
              command: "build"
              projects: "$(testProject)"
              arguments: "--configuration $(buildConfiguration) --no-restore"

          - task: DotNetCoreCLI@2
            displayName: "Build webjob"
            inputs:
              command: "build"
              projects: "$(webJobProject)"
              arguments: "--configuration $(buildConfiguration) --no-restore"

          - task: DotNetCoreCLI@2
            displayName: "Run tests"
            inputs:
              command: "test"
              projects: "$(testProject)"
              arguments: "--configuration $(buildConfiguration) --no-build --no-restore"

          - task: DotNetCoreCLI@2
            displayName: "Publish app"
            inputs:
              command: "publish"
              publishWebProjects: false
              projects: "$(webProject)"
              arguments: "--configuration $(buildConfiguration) --no-build --no-restore --output $(publishDir)"
              zipAfterPublish: false

          - task: DotNetCoreCLI@2
            displayName: "Publish webjob"
            inputs:
              command: "publish"
              publishWebProjects: false
              projects: "$(webJobProject)"
              arguments: "--configuration $(buildConfiguration) --no-build --no-restore --output $(webJobDir)"
              zipAfterPublish: false

          - task: ArchiveFiles@2
            displayName: "Create deployment zip"
            inputs:
              rootFolderOrFile: "$(publishDir)"
              includeRootFolder: false
              archiveType: "zip"
              archiveFile: "$(deploymentZip)"
              replaceExistingArchive: true

          - task: PublishPipelineArtifact@1
            displayName: "Publish pipeline artifact"
            inputs:
              targetPath: "$(publishDir)"
              artifact: "drop"

  - stage: Deploy
    displayName: Deploy to Azure App Service
    dependsOn: BuildAndTest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployWeb
        displayName: Deploy web app
        environment: "production"
        pool:
          vmImage: "ubuntu-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadPipelineArtifact@2
                  displayName: "Download artifact"
                  inputs:
                    artifact: "drop"
                    path: "$(Pipeline.Workspace)/drop"

                - task: AzureWebApp@1
                  displayName: "Deploy to App Service"
                  inputs:
                    azureSubscription: "$(azureSubscription)"
                    appType: "webApp"
                    appName: "$(appName)"
                    package: "$(Pipeline.Workspace)/drop/site.zip"
